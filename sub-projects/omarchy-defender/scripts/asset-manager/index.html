<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Manager - Omarchy Defender</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scanlines"></div>

  <header>
    <h1>OMARCHY DEFENDER</h1>
    <nav>
      <a href="/" class="active">Images</a>
      <a href="/audio.html">Audio</a>
    </nav>
  </header>

  <main>
    <aside class="sidebar">
      <h2>Categories</h2>
      <ul id="categories">
        <li class="loading">Loading...</li>
      </ul>

      <div class="actions">
        <button id="uploadBtn" class="btn">Upload Asset</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </aside>

    <section class="gallery">
      <div class="gallery-header">
        <h2 id="currentCategory">All Images</h2>
        <span id="assetCount">0 assets</span>
      </div>

      <div id="assets" class="assets-grid">
        <div class="loading-spinner">Loading assets...</div>
      </div>
    </section>

    <aside class="detail-panel" id="detailPanel">
      <div class="panel-header">
        <h3>Asset Details</h3>
        <button id="closePanel" class="btn-icon">×</button>
      </div>

      <div class="panel-content">
        <div class="preview">
          <img id="previewImage" src="" alt="Preview">
        </div>

        <div class="info">
          <p><strong>Filename:</strong> <span id="infoFilename"></span></p>
          <p><strong>Size:</strong> <span id="infoSize"></span></p>
          <p><strong>Path:</strong> <span id="infoPath"></span></p>
          <p><strong>Modified:</strong> <span id="infoModified"></span></p>
        </div>

        <div class="ai-section">
          <h4>AI Analysis</h4>
          <button id="analyzeBtn" class="btn btn-ai">Analyze with Gemini</button>
          <div id="analysisResult" class="analysis-result"></div>
        </div>

        <div class="chat-section">
          <h4>Chat about this asset</h4>
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Ask about this image...">
            <button id="sendChat" class="btn btn-small">Send</button>
          </div>
        </div>

        <div class="danger-zone">
          <button id="deleteBtn" class="btn btn-danger">Delete Asset</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <h3>Upload Asset</h3>
      <div class="upload-area" id="dropZone">
        <p>Drag & drop image here or click to browse</p>
        <input type="file" id="uploadFile" accept="image/*">
      </div>
      <div class="upload-options">
        <label>Category:
          <select id="uploadCategory">
            <option value="images">Root</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button id="cancelUpload" class="btn">Cancel</button>
        <button id="confirmUpload" class="btn btn-primary" disabled>Upload</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let assets = {};
    let currentCategory = null;
    let selectedAsset = null;
    let chatHistory = [];

    // DOM Elements
    const categoriesList = document.getElementById('categories');
    const assetsGrid = document.getElementById('assets');
    const detailPanel = document.getElementById('detailPanel');
    const uploadModal = document.getElementById('uploadModal');

    // Initialize
    async function init() {
      await loadAssets();
      setupEventListeners();
    }

    // Load all assets
    async function loadAssets() {
      try {
        const response = await fetch('/api/images');
        assets = await response.json();
        renderCategories();
        renderAssets();
      } catch (err) {
        console.error('Failed to load assets:', err);
        assetsGrid.innerHTML = '<p class="error">Failed to load assets</p>';
      }
    }

    // Render category list
    function renderCategories() {
      const categories = Object.keys(assets).sort();
      categoriesList.innerHTML = `
        <li class="${!currentCategory ? 'active' : ''}" data-category="">
          All Images (${Object.values(assets).flat().length})
        </li>
        ${categories.map(cat => `
          <li class="${currentCategory === cat ? 'active' : ''}" data-category="${cat}">
            ${cat} (${assets[cat].length})
          </li>
        `).join('')}
      `;

      // Update upload category dropdown
      const uploadCategory = document.getElementById('uploadCategory');
      uploadCategory.innerHTML = `
        <option value="images">Root</option>
        ${categories.map(cat => `<option value="images/${cat}">${cat}</option>`).join('')}
      `;
    }

    // Render assets grid
    function renderAssets() {
      let displayAssets = [];

      if (currentCategory) {
        displayAssets = assets[currentCategory] || [];
      } else {
        displayAssets = Object.values(assets).flat();
      }

      document.getElementById('currentCategory').textContent =
        currentCategory || 'All Images';
      document.getElementById('assetCount').textContent =
        `${displayAssets.length} assets`;

      if (displayAssets.length === 0) {
        assetsGrid.innerHTML = '<p class="empty">No assets found</p>';
        return;
      }

      assetsGrid.innerHTML = displayAssets.map(asset => `
        <div class="asset-card" data-path="${asset.path}">
          <div class="asset-thumb">
            <img src="${asset.path}" alt="${asset.filename}" loading="lazy">
          </div>
          <div class="asset-info">
            <span class="filename">${asset.filename}</span>
            <span class="size">${formatSize(asset.size)}</span>
          </div>
        </div>
      `).join('');
    }

    // Show asset details
    function showAssetDetails(asset) {
      selectedAsset = asset;
      chatHistory = [];

      document.getElementById('previewImage').src = asset.path;
      document.getElementById('infoFilename').textContent = asset.filename;
      document.getElementById('infoSize').textContent = formatSize(asset.size);
      document.getElementById('infoPath').textContent = asset.path;
      document.getElementById('infoModified').textContent =
        new Date(asset.modified).toLocaleString();

      document.getElementById('analysisResult').innerHTML = '';
      document.getElementById('chatMessages').innerHTML = '';

      detailPanel.classList.add('open');
    }

    // Analyze with Gemini
    async function analyzeImage() {
      if (!selectedAsset) return;

      const btn = document.getElementById('analyzeBtn');
      const result = document.getElementById('analysisResult');

      btn.disabled = true;
      btn.textContent = 'Analyzing...';
      result.innerHTML = '<div class="loading">Analyzing with Gemini...</div>';

      try {
        const response = await fetch('/api/gemini/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imagePath: selectedAsset.path,
            prompt: `Analyze this game asset for Omarchy Defender, a retro CRT terminal-style defense game.
Consider:
1. Visual quality and style consistency
2. Suitability for CRT phosphor glow aesthetic
3. File naming (should use xswarm prefix for SEO)
4. Suggested improvements
5. Overall rating (1-10)`
          })
        });

        const data = await response.json();

        if (data.error) {
          result.innerHTML = `<div class="error">${data.error}</div>`;
        } else {
          result.innerHTML = `<div class="analysis">${formatMarkdown(data.response)}</div>`;
        }
      } catch (err) {
        result.innerHTML = `<div class="error">Analysis failed: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Analyze with Gemini';
      }
    }

    // Chat with Gemini
    async function sendChat() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message || !selectedAsset) return;

      input.value = '';

      chatHistory.push({ role: 'user', content: message });
      renderChat();

      try {
        const response = await fetch('/api/gemini/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: chatHistory,
            imagePath: selectedAsset.path
          })
        });

        const data = await response.json();

        if (data.error) {
          chatHistory.push({ role: 'assistant', content: `Error: ${data.error}` });
        } else {
          chatHistory.push({ role: 'assistant', content: data.response });
        }

        renderChat();
      } catch (err) {
        chatHistory.push({ role: 'assistant', content: `Error: ${err.message}` });
        renderChat();
      }
    }

    // Render chat messages
    function renderChat() {
      const container = document.getElementById('chatMessages');
      container.innerHTML = chatHistory.map(msg => `
        <div class="chat-msg ${msg.role}">
          <strong>${msg.role === 'user' ? 'You' : 'Gemini'}:</strong>
          <div>${formatMarkdown(msg.content)}</div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    // Delete asset
    async function deleteAsset() {
      if (!selectedAsset) return;

      if (!confirm(`Delete ${selectedAsset.filename}?`)) return;

      try {
        const response = await fetch('/api/asset', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: selectedAsset.path })
        });

        if (response.ok) {
          detailPanel.classList.remove('open');
          selectedAsset = null;
          await loadAssets();
        } else {
          const data = await response.json();
          alert(`Delete failed: ${data.error}`);
        }
      } catch (err) {
        alert(`Delete failed: ${err.message}`);
      }
    }

    // Upload asset
    async function uploadAsset(file) {
      const category = document.getElementById('uploadCategory').value;
      const formData = new FormData();
      formData.append('file', file);
      formData.append('category', category);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          uploadModal.classList.remove('open');
          await loadAssets();
        } else {
          const data = await response.json();
          alert(`Upload failed: ${data.error}`);
        }
      } catch (err) {
        alert(`Upload failed: ${err.message}`);
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      // Category selection
      categoriesList.addEventListener('click', (e) => {
        const li = e.target.closest('li');
        if (!li) return;

        currentCategory = li.dataset.category || null;
        renderCategories();
        renderAssets();
      });

      // Asset selection
      assetsGrid.addEventListener('click', (e) => {
        const card = e.target.closest('.asset-card');
        if (!card) return;

        const path = card.dataset.path;
        const allAssets = Object.values(assets).flat();
        const asset = allAssets.find(a => a.path === path);
        if (asset) showAssetDetails(asset);
      });

      // Panel close
      document.getElementById('closePanel').addEventListener('click', () => {
        detailPanel.classList.remove('open');
      });

      // Analyze button
      document.getElementById('analyzeBtn').addEventListener('click', analyzeImage);

      // Chat
      document.getElementById('sendChat').addEventListener('click', sendChat);
      document.getElementById('chatInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChat();
      });

      // Delete
      document.getElementById('deleteBtn').addEventListener('click', deleteAsset);

      // Upload modal
      document.getElementById('uploadBtn').addEventListener('click', () => {
        uploadModal.classList.add('open');
      });

      document.getElementById('cancelUpload').addEventListener('click', () => {
        uploadModal.classList.remove('open');
      });

      // File input
      const uploadFile = document.getElementById('uploadFile');
      const confirmUpload = document.getElementById('confirmUpload');

      uploadFile.addEventListener('change', () => {
        confirmUpload.disabled = !uploadFile.files.length;
      });

      confirmUpload.addEventListener('click', () => {
        if (uploadFile.files.length) {
          uploadAsset(uploadFile.files[0]);
        }
      });

      // Drag and drop
      const dropZone = document.getElementById('dropZone');

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');

        if (e.dataTransfer.files.length) {
          uploadFile.files = e.dataTransfer.files;
          confirmUpload.disabled = false;
        }
      });
    }

    // Utilities
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    }

    // Start
    init();
  </script>
</body>
</html>
