<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Assets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; padding: 1rem; }
    a { color: #2563eb; }

    header { display: flex; gap: 2rem; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #ddd; }
    header h1 { font-size: 1rem; color: #666; font-weight: normal; }
    nav { display: flex; gap: 1rem; font-size: 0.85rem; }
    nav a.active { color: #333; font-weight: 600; text-decoration: none; }

    .toolbar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; font-size: 0.8rem; }
    .toolbar .stats { color: #666; }
    .toolbar .stats b { color: #16a34a; }
    .toolbar .stats .pending { color: #d97706; }

    select, button { background: #fff; border: 1px solid #ccc; color: #333; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer; border-radius: 3px; }
    button:hover { background: #f0f0f0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.primary:hover { background: #1d4ed8; }

    .category { margin-bottom: 1.5rem; }
    .category-header { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid #ddd; margin-bottom: 0.5rem; cursor: pointer; }
    .category-header:hover { color: #000; }
    .category-header h2 { font-size: 0.85rem; font-weight: 600; color: #555; }
    .category-header .count { font-size: 0.75rem; color: #888; }
    .category-header .count b { color: #16a34a; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.5rem; }

    .card { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0.6rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .card:hover { border-color: #bbb; }
    .card.playing { border-color: #2563eb; background: #f0f7ff; }
    .card.pending { opacity: 0.6; }

    .card-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 0.3rem; }
    .card-status.done { background: #16a34a; }
    .card-status.wait { background: #d97706; }

    .card-content { flex: 1; min-width: 0; }
    .card-id { font-size: 0.7rem; color: #888; margin-bottom: 0.2rem; }
    .card-text { font-size: 0.75rem; color: #555; line-height: 1.3; margin-bottom: 0.4rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .card-controls { display: flex; gap: 0.3rem; align-items: center; }
    .card-controls button { padding: 0.2rem 0.4rem; font-size: 0.65rem; }
    .play-btn { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 0.7rem; }

    .progress { flex: 1; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; }
    .progress .bar { height: 100%; background: #2563eb; width: 0; }

    .hidden { display: none !important; }

    .api-info { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0.5rem 0.75rem; font-size: 0.75rem; margin-bottom: 1rem; display: flex; gap: 1.5rem; }
    .api-info span { color: #888; }
    .api-info b { color: #333; }
  </style>
</head>
<body>
  <header>
    <h1>Asset Manager</h1>
    <nav>
      <a href="/">Images</a>
      <a href="/audio.html" class="active">Audio</a>
    </nav>
  </header>

  <div class="api-info" id="apiInfo" style="display:none">
    <span>Voice: <b id="voiceName">-</b></span>
    <span>Used: <b id="charsUsed">-</b></span>
    <span>Remaining: <b id="charsRemaining">-</b></span>
  </div>

  <div class="toolbar">
    <div class="stats">
      <b id="generated">0</b>/<span id="total">0</span> generated
      <span class="pending">(<span id="pending">0</span> pending)</span>
    </div>
    <select id="filter">
      <option value="all">All</option>
      <option value="pending">Pending</option>
      <option value="generated">Generated</option>
    </select>
    <button id="generateAll" class="primary">Generate All Pending</button>
  </div>

  <div id="categories"></div>

  <script>
    let data = { categories: {}, stats: {} };
    let voices = [];
    let voiceId = null;
    let filter = 'all';
    let playing = null;

    async function init() {
      await Promise.all([loadData(), loadVoices(), loadSubscription()]);
      document.getElementById('filter').onchange = e => { filter = e.target.value; render(); };
      document.getElementById('generateAll').onclick = generateAll;
    }

    async function loadData() {
      const res = await fetch('/api/audio');
      data = await res.json();
      document.getElementById('total').textContent = data.stats.total;
      document.getElementById('generated').textContent = data.stats.generated;
      document.getElementById('pending').textContent = data.stats.pending;
      render();
    }

    async function loadVoices() {
      try {
        const res = await fetch('/api/elevenlabs/voices');
        const d = await res.json();
        if (d.voices?.length) { voices = d.voices; voiceId = voices[0].voice_id; }
      } catch(e) {}
    }

    async function loadSubscription() {
      try {
        const res = await fetch('/api/elevenlabs/subscription');
        const d = await res.json();
        if (!d.error) {
          document.getElementById('apiInfo').style.display = 'flex';
          document.getElementById('voiceName').textContent = voices[0]?.name || 'Default';
          document.getElementById('charsUsed').textContent = d.character_count?.toLocaleString() || 0;
          document.getElementById('charsRemaining').textContent = ((d.character_limit || 0) - (d.character_count || 0)).toLocaleString();
        }
      } catch(e) {}
    }

    function render() {
      const container = document.getElementById('categories');
      let html = '';

      for (const [cat, lines] of Object.entries(data.categories)) {
        let filtered = lines;
        if (filter === 'pending') filtered = lines.filter(l => !l.generated);
        else if (filter === 'generated') filtered = lines.filter(l => l.generated);
        if (!filtered.length && filter !== 'all') continue;

        const done = lines.filter(l => l.generated).length;
        html += `<div class="category">
          <div class="category-header" onclick="toggle('${cat}')">
            <h2>${cat.replace(/_/g, ' ')}</h2>
            <span class="count"><b>${done}</b>/${lines.length}</span>
          </div>
          <div class="grid" id="grid-${cat}">
            ${filtered.map(l => card(l, cat)).join('')}
          </div>
        </div>`;
      }
      container.innerHTML = html || '<p style="color:#888">No items</p>';
    }

    function card(line, cat) {
      const done = line.generated;
      return `<div class="card ${done ? '' : 'pending'}" id="card-${line.id}">
        <div class="card-status ${done ? 'done' : 'wait'}"></div>
        <div class="card-content">
          <div class="card-id">${line.id}</div>
          <div class="card-text" title="${esc(line.text)}">${esc(line.text)}</div>
          <div class="card-controls">
            ${done ? `<button class="play-btn" onclick="play('${line.id}','${line.path}')">&#9654;</button>
              <div class="progress" id="prog-${line.id}"><div class="bar"></div></div>` : ''}
            <button onclick="generate('${line.id}','${esc(line.text)}',${JSON.stringify(line.settings || {}).replace(/"/g,'&quot;')})">${done ? 'Regen' : 'Gen'}</button>
          </div>
        </div>
        ${done ? `<audio id="audio-${line.id}" src="${line.path}" preload="none"></audio>` : ''}
      </div>`;
    }

    function toggle(cat) {
      document.getElementById('grid-' + cat)?.classList.toggle('hidden');
    }

    function play(id, path) {
      if (playing) { playing.pause(); playing.currentTime = 0; document.querySelector('.card.playing')?.classList.remove('playing'); }

      const audio = document.getElementById('audio-' + id);
      const card = document.getElementById('card-' + id);
      const prog = document.querySelector('#prog-' + id + ' .bar');

      if (playing === audio) { playing = null; return; }

      audio.play();
      card.classList.add('playing');
      playing = audio;

      audio.ontimeupdate = () => { prog.style.width = (audio.currentTime / audio.duration * 100) + '%'; };
      audio.onended = () => { card.classList.remove('playing'); playing = null; prog.style.width = '0'; };
    }

    async function generate(id, text, settings) {
      if (!voiceId) { alert('Voices not loaded'); return; }
      const btn = event.target;
      btn.disabled = true; btn.textContent = '...';

      try {
        const res = await fetch('/api/elevenlabs/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voiceId, filename: id + '.mp3', settings })
        });
        const d = await res.json();
        if (d.error) alert(d.error);
        else { await loadData(); await loadSubscription(); }
      } catch(e) { alert(e.message); }

      btn.disabled = false;
    }

    async function generateAll() {
      const pending = [];
      for (const [cat, lines] of Object.entries(data.categories)) {
        for (const l of lines) if (!l.generated) pending.push({ ...l, cat });
      }
      if (!pending.length) { alert('All done!'); return; }
      if (!confirm(`Generate ${pending.length} files?`)) return;

      const btn = document.getElementById('generateAll');
      btn.disabled = true;

      for (let i = 0; i < pending.length; i++) {
        btn.textContent = `${i+1}/${pending.length}...`;
        const l = pending[i];
        try {
          await fetch('/api/elevenlabs/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: l.text, voiceId, filename: l.id + '.mp3', settings: l.settings || {} })
          });
          await new Promise(r => setTimeout(r, 800));
        } catch(e) {}
      }

      btn.disabled = false;
      btn.textContent = 'Generate All Pending';
      await loadData();
      await loadSubscription();
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const sse = new EventSource('/api/events');
    sse.onmessage = e => { const d = JSON.parse(e.data); if (d.type === 'fileChange' && d.dir === 'audio') loadData(); };

    init();
  </script>
</body>
</html>
