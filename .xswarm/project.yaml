# Entry point for orchestrator agents. Points at what this project
# already has; project-init moved nothing to create this.
recipe: monorepo
mode: parked          # review | active | reactive | periodic | parked

docs:
  prd: sub-projects/omarchy-defender/omarchy-defender-PRD.md
  deploy:
    - packages/server/wrangler.toml
    - wrangler.toml

audit:
  targets: {}          # not a website
  ratchet: false

authority:
  may: [continue_plan, run_tests, run_audits, fix_from_audit]
  escalate: [commit, deploy_production, deploy_staging, migrate_data, outward_facing]

gate:
  visual_paths: []
